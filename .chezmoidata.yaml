# Machine-specific configuration
# Add new machines here as you migrate them to chezmoi
#
# Available Catppuccin Mocha accent colors:
#   rosewater: "#f5e0dc"  flamingo: "#f2cdcd"  pink:    "#f5c2e7"
#   mauve:     "#cba6f7"  red:      "#f38ba8"  maroon:  "#eba0ac"
#   peach:     "#fab387"  yellow:   "#f9e2af"  green:   "#a6e3a1"
#   teal:      "#94e2d5"  sky:      "#89dceb"  sapphire:"#74c7ec"
#   blue:      "#89b4fa"  lavender: "#b4befe"

machines:
  # NOTE: keys must match each machine's real OS hostname (`hostname -s`,
  # i.e. chezmoi's .chezmoi.hostname) — NOT the Tailscale name or SSH alias.
  MacBookPro:            # control plane (this machine)
    accent: "#cba6f7"    # mauve
    label: "control"

  big-rig-gaming:
    accent: "#94e2d5"    # teal
    label: "gaming"

  megaboss:
    accent: "#f9e2af"    # yellow
    label: "megaboss"

  miniboss:              # Mac mini — verify `hostname -s` == "miniboss" for accent to apply
    accent: "#74c7ec"    # sapphire
    label: "miniboss"

# Fallback defaults for unlisted machines
defaults:
  darwin:
    accent: "#89b4fa"    # blue
    label: "mac"
  linux:
    accent: "#a6e3a1"    # green
    label: "linux"
